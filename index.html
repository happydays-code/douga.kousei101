const different = (list, previous) => pick(list.filter(v=>v!==previous));

function generateResult(){
 const previous = state.previousId ? JSON.parse(state.previousId) : null;
 const type = state.type===8 ? pick([0,1,2,3,4,5,6,7]) : state.type;
 const choices = STRUCTURES.map((s,i)=>s.type===type?i:-1).filter(i=>i>=0);
 const structureIndex = different(choices,previous?.structureIndex);
 const structure = STRUCTURES[structureIndex];
 const categoryPool = [...structure.categories];
 // 商用フックは活動の紹介に合う構成・目的の組み合わせにだけ混ぜます。
 if(state.purpose===5 && [6,7].includes(type)) categoryPool.push('service');
 const hooks = categoryPool.flatMap(c=>HOOKS[c]).filter(h=>type===4 || !/[3３]つ|3選/.test(h));
 const hook = different(hooks,previous?.hook);
 const themeIndices = [state.target*3,state.target*3+1,state.target*3+2];
 const themeIndex = different(themeIndices,previous?.themeIndex);
 const theme = THEMES[state.genre][themeIndex];
 const cta = different(CTAS[state.purpose],previous?.cta);
 state.previousId = JSON.stringify({structureIndex,hook,themeIndex,cta});
 return {type,name:structure.name,theme,hook:fill(hook,theme),steps:structure.steps.map(([label,text])=>[label,fill(text,theme)]),cta,stories:fill(pick(STORIES[type]),theme),threads:fill(pick(THREADS[type]),theme)};
}

 const rows=[['冒頭 0〜3秒',r.hook],...r.steps,['最後のCTA',r.cta]];
 return `<section class="result"><div class="result-heading"><p class="eyebrow">YOUR REEL IDEA</p><h2 id="screenTitle" tabindex="-1">今日の動画構成アイデア</h2><p class="small">＼ 今日のリールはこれ！ ／</p><span class="badge">${esc(r.name)}</span></div><article class="result-card"><p class="eyebrow">TODAY’S THEME</p><h3 class="theme">${esc(r.theme)}</h3><div class="context"><span>ジャンル：${esc(GENRES[state.genre].name)}</span><span>${state.genre===7?'ネタの種':'届けたい相手'}：${esc(TARGETS[state.genre][state.target])}</span><span>目的：${esc(PURPOSES[state.purpose])}</span></div>${rows.map(([label,text])=>`<div class="script-row"><h3>${esc(label)}</h3><p>${esc(text)}</p></div>`).join('')}<p class="edit-hint">［ ］は、あなたの言葉を入れるところ。選んだ${state.genre===7?'ネタの種':'相手'}を思い浮かべて、実際の経験や具体例を足してね。内容に合わせて冒頭の言葉も調整できます。</p></article><div class="actions"><button class="primary" id="again">もう一回ガチャる♪</button><button class="secondary" id="copy">構成をコピーする</button><span class="copy-status" id="copyStatus" role="status"></span><button class="text-button" id="change">ジャンル・条件を変更する</button></div><p class="notice">${TEXT.disclaimer}</p><section class="section"><p class="eyebrow">このまま投稿する前に…</p><h2>人間の目を入れよう！</h2><div class="checklist">${checks.map(c=>`<label><input type="checkbox">${c}</label>`).join('')}</div><div class="human-message"><p>AIやテンプレートで「構成」は速く作れます。</p><p>でも、<br>「本当にこの冒頭で見る？」<br>「この言葉、お客様が使う？」<br>「あなたらしさは入ってる？」</p><p><strong>最後に必要なのは、人間の目です。</strong></p></div></section><section class="section reuse"><p class="eyebrow">ONE IDEA, MORE STORIES.</p><h2>このネタ、<br>リールだけで終わらせない♪</h2><p class="small" style="margin-top:12px">リール → Stories → Threads</p><div class="reuse-item"><h3>01 / Stories</h3><p>${esc(r.stories)}</p></div><div class="reuse-item"><h3>02 / Threads</h3><p>${esc(r.threads)}</p></div></section><section class="section course course-magic"><div class="course-sparkles" aria-hidden="true"><span>✦</span><span>✧</span><span>✦</span><span>✧</span><span>✦</span><span>✧</span></div><div class="course-content"><p class="course-ribbon">ここから、もう一歩。</p><div class="course-emblem" aria-hidden="true">♡<span>✦</span></div><h2><span class="course-heading-small">ガチャで「構成」は作れる。</span>でも、<span class="course-highlight">「見られる動画」</span>に<br>するのはここから。</h2><p>AIやテンプレートは、<br>ネタ出しや構成を速くするのが得意です。</p><div class="course-questions"><span class="course-but">でも…</span><p>この冒頭なら本当に見る？</p><p>この画角なら指が止まる？</p><p>テロップは1段？2段？</p><p>この言葉はお客様に響く？</p></div><p class="course-insight">そんな最後の判断には、<br><strong>人間の目と<br class="course-mobile-break">マーケティング視点</strong><br>が必要です。</p><div class="course-invitation"><span class="course-ticket">無料講座へのご招待</span><p>無料講座では、AIで時短しながら<br><strong>『見られる・伝わるリール』</strong>に<br>仕上げる方法を<br>実例を使ってお伝えします。</p></div><a id="courseLink" class="primary" href="#">無料で「見られるリール」の作り方を学ぶ</a><p class="small" id="courseStatus" role="status">${FREE_COURSE_URL==='#'?'無料講座のご案内は、ただいま準備中です。':''}</p></div></section></section>`;
}
function resultText(){const r=state.result;return `${APP_TITLE}\n今日の動画構成アイデア【${r.name}】\nテーマ：${r.theme}\nジャンル：${GENRES[state.genre].name}\n${state.genre===7?'ネタの種':'届けたい相手'}：${TARGETS[state.genre][state.target]}\n目的：${PURPOSES[state.purpose]}\n\n`+[['冒頭 0〜3秒',r.hook],...r.steps,['最後のCTA',r.cta],['Stories',r.stories],['Threads',r.threads]].map(([l,t])=>`■${l}\n${t}`).join('\n\n');}
async function copyResult(){
 const text=resultText();
 try{if(!navigator.clipboard?.writeText)throw new Error('manual');await navigator.clipboard.writeText(text);document.getElementById('copyStatus').textContent='構成をコピーしました♪';}
 catch{const dialog=document.getElementById('copyDialog');document.getElementById('copyText').value=text;dialog.showModal();document.getElementById('copyText').select();}
}
function render(focus=true){
 app.innerHTML=state.step===0?renderHome():state.step<=4?renderWizard():state.step===5?renderGacha():renderResult();
 const on=(id,fn)=>document.getElementById(id)?.addEventListener('click',fn);
 on('start',()=>{state.step=1;render();});
 on('back',()=>{state.step--;render();});on('next',()=>{state.step++;render();});
 document.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{
  const key=['','genre','target','purpose','type'][state.step],value=Number(button.dataset.choice);
  if(key==='genre' && state.genre!==value)state.target=null;
  state[key]=value;
  // 選択時はフォーカスを維持し、次へボタンを有効化。
  document.querySelectorAll('[data-choice]').forEach(b=>{const selected=Number(b.dataset.choice)===value;b.setAttribute('aria-pressed',String(selected));b.querySelector('.checkmark').textContent=selected?'✓':'';});
  document.getElementById('next').disabled=false;
 }));
 on('roll',roll);on('capsule',openCapsule);
 on('editConditions',()=>{if(state.phase!=='idle')return;state.step=4;render();});
 on('again',()=>{state.step=5;state.phase='idle';render();roll();});
 on('change',()=>{state.step=1;render();});on('copy',copyResult);
 const link=document.getElementById('courseLink');
 if(link){
  // http(s)のURLのみ利用。未設定時はページを移動せず案内を表示。
  let valid=false;try{valid=/^https?:$/.test(new URL(FREE_COURSE_URL).protocol);}catch{}
  if(valid){link.href=FREE_COURSE_URL;link.rel='noopener noreferrer';}
  else{link.addEventListener('click',e=>{e.preventDefault();document.getElementById('courseStatus').textContent='無料講座は準備中です。公開まで、ガチャを楽しんでね♪';});}
 }
 if(focus){window.scrollTo({top:0,behavior:'instant'});document.getElementById('screenTitle')?.focus({preventScroll:true});}
}
document.getElementById('closeDialog').addEventListener('click',()=>document.getElementById('copyDialog').close());
document.title=APP_TITLE;
render(false);
</script>
</body>
</html>
